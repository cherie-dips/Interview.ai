name: Weekly backup

# Backs up the Postgres database every week with pg_dump. The backup holds password hashes and
# students' notes, so it's encrypted with BACKUP_PASSPHRASE before being stored as a workflow artifact
# (artifacts of a public repository can be downloaded by others). Decrypt and restore as described
# in DEPLOYMENT.md ("Backups and restore").

on:
  schedule:
    - cron: "30 21 * * 6" # Saturdays 21:30 UTC = Sundays 03:00 in India
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check secrets
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          for name in DATABASE_URL BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Backup skipped::Add these repository secrets to enable weekly backups:$missing"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Back up
        if: steps.check.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # pg_dump from the official Postgres 18 image (it can read servers up to version 18; Neon runs 18).
        run: |
          docker run --rm -e DATABASE_URL postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' > backup.dump
          test -s backup.dump

      - name: Encrypt
        if: steps.check.outputs.run == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="study-ai-backup-$(date -u +%Y%m%dT%H%M%SZ).dump.gpg"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$name" backup.dump
          shred -u backup.dump 2>/dev/null || rm -f backup.dump
          ls -l "$name"

      - name: Upload encrypted backup
        if: steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: study-ai-backup-${{ github.run_id }}
          path: study-ai-backup-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
